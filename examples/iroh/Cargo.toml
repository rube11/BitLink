[package]
name = "bit-to-byte-iroh"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false
description = "A separate peer-to-peer connection experiment for Bit to Byte"

[[bin]]
name = "iroh-receiver"
path = "src/receiver/main.rs"

[[bin]]
name = "iroh-sender"
path = "src/sender/main.rs"

[dependencies]
# Keep router port mapping disabled. This experiment uses hole punching and relays.
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "=0.5.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints.clippy]
question_mark = "allow"
redundant_field_names = "allow"
needless_return = "allow"
single_match = "allow"
