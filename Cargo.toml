[package]
name = "bit-to-byte"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A readable terminal messenger using the club UDP relay"
publish = false
default-run = "bit-to-byte"

[[bin]]
name = "udp-server"
path = "relay/server.rs"

[dependencies]
getrandom = "0.3"
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
chacha20poly1305 = "0.11.0"
base64 = "0.23.1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

# Prefer explicit error branches and named fields for members learning Rust.
[lints.clippy]
question_mark = "allow"
redundant_field_names = "allow"
needless_return = "allow"
single_match = "allow"
while_let_loop = "allow"
needless_bool_assign = "allow"
manual_find = "allow"
